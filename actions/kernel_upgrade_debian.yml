---
name: kernel_upgrade_debian
description: upgrade the raspberrypi Debian Kernel
runner_type: orquesta
entry_point: workflows/kernel_upgrade_debian.yml
enabled: true
parameters:
  host:
    required: true
    type: string
  username:
    required: true
    type: string
  sudo_password:
    required: true
    secret: true
    type: string
    default: "{{ st2kv.system.sudo_password| decrypt_kv }}"
