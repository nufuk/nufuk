---
name: package_upgrade_debian
description: upgrade the raspberrypi Debian packages
runner_type: orquesta
entry_point: workflows/package_upgrade_debian.yml
enabled: true
parameters:
  hosts:
    required: true
    type: array
    default: "{{ st2kv.system.debian_server }}"
  username:
    required: true
    type: string
    default: "{{ st2kv.system.user }}"
  sudo_password:
    required: true
    secret: true
    type: string
    default: "{{ st2kv.system.sudo_password| decrypt_kv }}"
