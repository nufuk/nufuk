version: 1.0
description: Upgrade packages Debian (raspberrypi)
input: 
  - hosts
  - username
  - sudo_password
tasks:

  sudo_update_upgrade:
    with: <% ctx(hosts) %>
    action: core.remote_sudo
    input:
      hosts: <% item() %>
      cmd: "apt update -y; apt upgrade -y;"
      sudo_password: <% ctx(sudo_password) %>
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
      timeout: 1800
    next:
      - when: <% succeeded() %>
        do: 
          - send_success
      - when: <% failed() %>
        do:
          - send_failed

  send_failed:
    action: nufuk.telegram_message
    input:
      message: "Package upgrade failed on Debian Server: <% ctx(host) %> with error: <% result().stderr %>"
  
  send_success:
    action: nufuk.telegram_message
    input:
      message: "Package upgrade successfull on Debian Server: <% ctx(host) %>"
