version: 1.0
description: Upgrade Kernel Debian (raspberrypi), use this workflow for a single server inside a wrapper for many server
input: 
  - host
  - username
  - sudo_password
tasks:
  check_kernel_before:
    action: core.remote
    input:
      hosts: <% ctx(host) %>
      cmd: "uname -r"
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
    next:
      - do: sudo_update

  sudo_update:
    action: core.remote_sudo
    input:
      hosts: <% ctx(host) %>
      cmd: "apt upgrade -y"
      sudo_password: <% ctx(sudo_password) %>
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
      timeout: 1800
    next:
      - do: sudo_upgrade_kernel

  sudo_upgrade_kernel:
    action: core.remote_sudo
    input:
      hosts: <% ctx(host) %>
      cmd: "apt upgrade linux-image -y"
      sudo_password: <% ctx(sudo_password) %>
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
      timeout: 1800
    next:
      - do: sudo_reboot

  sudo_reboot:
    action: core.remote_sudo
    input:
      hosts: <% ctx(host) %>
      cmd: "reboot; exit 0;"
      sudo_password: <% ctx(sudo_password) %>
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
      timeout: 1800
    next:
      - do: check_kernel

  check_kernel:
    action: core.remote
    delay: 120
    input:
      hosts: <% ctx(host) %>
      cmd: "uname -r"
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
