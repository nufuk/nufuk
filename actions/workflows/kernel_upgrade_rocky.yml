version: 1.0
description: Upgrade Kernel Rocky, use this workflow for a single server inside a wrapper for many server
input: 
  - host
  - username
  - sudo_password
tasks:
  check_kernel_before:
    action: core.remote
    input:
      hosts: <% ctx(host) %>
      cmd: "uname -r"
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
    next:
      - when: <% succeeded() %>
        do: 
          - sudo_upgrade_kernel
      - when: <% failed() %>
        do:
          - send_failed

  sudo_upgrade_kernel:
    action: core.remote_sudo
    input:
      hosts: <% ctx(host) %>
      cmd: "yum update kernel -y"
      sudo_password: <% ctx(sudo_password) %>
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
      timeout: 1800
    next:
      - when: <% succeeded() %>
        do: 
          - sudo_reboot
      - when: <% failed() %>
        do:
          - send_failed

  sudo_reboot:
    action: core.remote_sudo
    input:
      hosts: <% ctx(host) %>
      cmd: "reboot; exit 0;"
      sudo_password: <% ctx(sudo_password) %>
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
      timeout: 1800
    next:
      - when: <% succeeded() %>
        do: 
          - check_kernel
      - when: <% failed() %>
        do:
          - send_failed

  check_kernel:
    action: core.remote
    delay: 240
    input:
      hosts: <% ctx(host) %>
      cmd: "uname -r"
      username: <% ctx(username) %>
      env:
        StrictHostKeyChecking: "accept-new"
    next:
      - when: <% succeeded() %>
        do: 
          - send_success
      - when: <% failed() %>
        do:
          - send_failed

  send_failed:
    action: nufuk.telegram_message
    input:
      message: "Kernel upgrade failed on Rocky Server: <% ctx(host) %> with error: <% result().stderr %>"
  
  send_success:
    action: nufuk.telegram_message
    input:
      message: "Kernel upgrade successfull on Rocky Server: <% ctx(host) %>"