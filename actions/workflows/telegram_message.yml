version: 1.0
description: send message to telegram
input: 
  - message 
  - chat_id
  - bot_token
  - server_ip

vars:
  - my_string: "lorem ipsum"

tasks:
  checkout_project:
    action: core.remote
    input:
      hosts: <% ctx(server_ip) %>
      cmd: "git clone https://github.com/nufuk/telegram-integration.git"
      cwd: "/tmp/"
      username: "nufuk"
    next:
      - when: <% succeeded() %>
        do: 
          - generate_string
  
  generate_string:
    action: core.local
    input:
      cmd: "python3 -c 'import secrets; print(secrets.token_hex(16))'"
    next:
      - when: <% succeeded() %>
        do: 
          - move_folder
      - publish:
          - my_string: <% result().stdout.strip() %>

  move_folder:
    action: core.remote
    input:
      hosts: <% ctx(server_ip) %>
      cmd: "mv telegram-integration <% ctx(my_string) %>"
      cwd: "/tmp/"
      username: "nufuk"
    next:
      - when: <% succeeded() %>
        do: 
          - install_dependencies
      - when: <% failed() %>
        do: 
          - cleanup

  install_dependencies:
    action: core.remote
    input:
      hosts: <% ctx(server_ip) %>
      cmd: "./install.sh"
      cwd: "/tmp/<% ctx(my_string) %>"
      username: "nufuk"
    next:
      - when: <% succeeded() %>
        do: 
          - send_message
      - when: <% failed() %>
        do: 
          - cleanup

  send_message:
    action: core.remote
    input:
      hosts: <% ctx(server_ip) %>
      cmd: "./main.py -m '<% ctx(message) %>' -c <% ctx(chat_id) %> -t '<% ctx(bot_token) %>'"
      cwd: "/tmp/<% ctx(my_string) %>"
      username: "nufuk"
    next:
        - do: 
            - cleanup

  cleanup:
    action: core.remote
    input:
      hosts: <% ctx(server_ip) %>
      cmd: "rm -rf ./<% ctx(my_string) %>"
      cwd: "/tmp/"
      username: "nufuk"
