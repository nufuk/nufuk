---
name: package_upgrade_rocky
description: upgrade the Rocky packages
runner_type: orquesta
entry_point: workflows/package_upgrade_rocky.yml
enabled: true
parameters:
  hosts:
    required: true
    type: array
    default: "{{ st2kv.system.rocky_server }}"
  username:
    required: true
    type: string
    default: "{{ st2kv.system.user }}"
  sudo_password:
    required: true
    secret: true
    type: string
    default: "{{ st2kv.system.sudo_password| decrypt_kv }}"
